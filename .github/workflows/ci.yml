name: test and build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
  DATABASE_USER: ${{ secrets.DATABASE_USER }}
  DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
  DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  DEBUG: ${{ secrets.DEBUG }}
  DATABASE_ENGINE: ${{ secrets.DATABASE_ENGINE }}

jobs:
  health-check-job:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13.1]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache dependency
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests with pytests
      working-directory: backend/src
      run: |
        pytest -s -v
    
  package-job:
    runs-on: ubuntu-latest
    needs: [health-check-job]
    if: ${{ github.event_name == 'push' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and publish image
      run: |
        docker compose up --build -d telmed-backend:v1
  
  deploy:
    runs-on: ubuntu-latest
    needs: [package-job]
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::074124924163:role/push-to-ecr
        aws-region: us-east-1
    - name: Push to ECR
      id: ecr
      uses: jwalton/gh-ecr-push@v2
      with:
        access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        region: us-east-1
        local-image: telmed-backend:v1
        image: telmed-backend:v1, telmed-backend:latest